<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>눈고래와 눈 내리는 밤</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1630;
    font-family: 'Malgun Gothic', system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: manipulation; }
  .hint { position: fixed; left: 0; right: 0; top: 14px; text-align: center; color: #d6e6ff;
    font-size: .95rem; pointer-events: none; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .back { position: fixed; left: 14px; bottom: 12px; color: #0b1630; font-size: .9rem;
    background: rgba(255,255,255,.85); padding: 4px 10px; border-radius: 999px; text-decoration: none; }
  .back:focus-visible { outline: 3px solid #0b1630; outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="눈이 내리는 밤바다에서 헤엄치는 하얀 고래. 고래를 누르면 뛰어오르며 말을 건넵니다."></canvas>
<div class="hint">고래를 눌러 보세요 · 공중에서 연달아 누르면 하늘을 날아요 · 빈 곳을 누르면 눈이 쏟아져요</div>
<a class="back" href="./">← 눈고래의 바다</a>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H;
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
let wind = 0, t = 0;
const flakes = Array.from({ length: reduce ? 60 : 170 }, () =>
  ({ x: rand(0, W), y: rand(0, H), r: rand(1, 3.2), v: rand(.4, 1.4), p: rand(0, 6.28) }));
const stars = Array.from({ length: 70 }, () =>
  ({ x: rand(0, 1), y: rand(0, .6), r: rand(.4, 1.4), p: rand(0, 6.28) }));
const parts = [];
const whale = { x: W * .3, dir: 1, speed: reduce ? .25 : .7, jump: 0, vj: 0, say: '', sayT: 0, n: 0 };
const lines = ['너는 울지 않는구나.', '눈은 슬픔을 감싸 안는 법을 알고 있어.',
  '별들에게 인사하러 가 볼까?', '눈송이를 등에 싣고 내려가자.', '고마워 — 오늘도 눈이 와서.'];

const seaY = () => H * .8;
const whaleY = () => seaY() - 6 + Math.sin(t * 1.5) * 5 - whale.jump;

function drawWhale() {
  ctx.save();
  ctx.translate(whale.x, whaleY());
  ctx.scale(whale.dir, 1);
  ctx.rotate(-whale.vj * .03);
  ctx.fillStyle = '#f5faff'; ctx.strokeStyle = '#b9d3f5'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-55, 0);
  ctx.bezierCurveTo(-45, -28, 30, -36, 66, -8);
  ctx.bezierCurveTo(78, 2, 70, 18, 44, 22);
  ctx.bezierCurveTo(10, 30, -40, 22, -55, 0);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-50, -3);
  ctx.quadraticCurveTo(-72, -4, -80, -26); ctx.quadraticCurveTo(-92, -14, -86, 0);
  ctx.quadraticCurveTo(-92, 14, -80, 26); ctx.quadraticCurveTo(-72, 4, -50, 3);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1d3b66'; ctx.beginPath(); ctx.arc(48, -2, 2.6, 0, 6.283); ctx.fill();
  ctx.restore();
}

function bubble(text, x, y) {
  ctx.font = '15px "Malgun Gothic", sans-serif';
  const w = ctx.measureText(text).width + 24, h = 30;
  const bx = Math.max(8, Math.min(W - w - 8, x - w / 2)), by = y - h;
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(bx, by, w, h, 12); else ctx.rect(bx, by, w, h);
  ctx.fill();
  ctx.fillStyle = '#0b1630'; ctx.textBaseline = 'middle';
  ctx.fillText(text, bx + 12, by + h / 2 + 1);
}

function spawn(x, y, n, speed, g, up) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.283), s = rand(.5, speed);
    parts.push({ x, y, vx: up ? rand(-1.3, 1.3) : Math.cos(a) * s,
      vy: up ? rand(-6.5, -3) : Math.sin(a) * s, g, life: 60, r: rand(1.5, 3) });
  }
}

const rings = [];
function splash(x, sp) {
  const n = Math.min(90, Math.round(12 + sp * 3.2));
  for (let i = 0; i < n; i++) {
    const a = rand(-2.7, -.45), v = rand(.35, 1) * sp * .55 + 1.5;
    parts.push({ x: x + rand(-18, 18), y: seaY(), vx: Math.cos(a) * v * .8, vy: Math.sin(a) * v,
      g: .22, life: Math.round(rand(40, 70)), r: rand(1.4, 3.6) });
  }
  const k = Math.min(4, 1 + Math.floor(sp / 6));
  for (let i = 0; i < k; i++) rings.push({ x: x, r: -i * 14, a: .8, v: 1.6 + sp * .08 });
}

function frame() {
  t += .016;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b1630'); g.addColorStop(1, '#1d3b66');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  for (const s of stars) {
    ctx.globalAlpha = .5 + .5 * Math.sin(t * 2 + s.p);
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;

  whale.x += whale.dir * whale.speed;
  if (whale.x > W - 100) whale.dir = -1;
  if (whale.x < 100) whale.dir = 1;
  if (whale.jump !== 0 || whale.vj !== 0) {
    const prev = whale.jump;
    if (whale.jump > 0) {
      whale.vj -= .6;                                   // 공중: 중력
    } else {
      whale.vj += -whale.jump * .02; whale.vj *= .95;   // 물속: 부력 + 물의 저항
    }
    whale.jump += whale.vj;

    const maxJ = seaY() - 60;                           // 화면 위로 못 나가게
    if (whale.jump > maxJ) { whale.jump = maxJ; whale.vj = Math.min(whale.vj, 0); }
    const maxD = Math.min(H * .15, 140);                // 바닥 아래로 못 내려가게
    if (whale.jump < -maxD) { whale.jump = -maxD; whale.vj = Math.max(whale.vj, 0); }

    if (prev > 0 && whale.jump <= 0) {                  // 입수: 속도에 따라 물보라와 깊이가 달라짐
      const impact = -whale.vj;
      if (impact > 2) splash(whale.x, impact);
      whale.vj *= .9;
    } else if (prev <= 0 && whale.jump > 0 && whale.vj > 2) {   // 출수
      splash(whale.x, whale.vj * .7);
    }
    if (whale.jump < -15 && !reduce && Math.random() < .12) {   // 물속 거품
      parts.push({ x: whale.x + rand(-40, 40), y: whaleY() + rand(-10, 10), vx: rand(-.2, .2),
        vy: rand(-1.6, -.8), g: 0, life: 70, r: rand(1.5, 3.2), b: true });
    }
    if (whale.jump > 40 && !reduce) {                   // 공중 꼬리 반짝임
      parts.push({ x: whale.x - whale.dir * 70, y: whaleY(), vx: rand(-.3, .3), vy: rand(-.2, .4),
        g: .01, life: 45, r: rand(1.5, 3.5) });
    }
    if (whale.jump <= 0 && Math.abs(whale.jump) < .4 && Math.abs(whale.vj) < .3) {
      whale.jump = 0; whale.vj = 0;                     // 잔잔해지면 수면에 정지
    }
  }
  drawWhale();

  const sg = ctx.createLinearGradient(0, seaY(), 0, H);
  sg.addColorStop(0, 'rgba(140,182,232,.8)'); sg.addColorStop(1, 'rgba(36,76,138,.9)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, seaY() + Math.sin(x * .012 + t * 1.2) * 6);
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();

  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.r += r.v; r.a -= .012;
    if (r.a <= 0) { rings.splice(i, 1); continue; }
    if (r.r <= 0) continue;
    ctx.strokeStyle = 'rgba(255,255,255,' + r.a + ')'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(r.x, seaY(), r.r, r.r * .16, 0, 0, 6.283); ctx.stroke();
  }

  if (whale.sayT > 0) { whale.sayT--; bubble(whale.say, whale.x, whaleY() - 60); }

  ctx.fillStyle = '#fff';
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--;
    if (p.b && p.y < seaY()) p.life = 0;   // 거품은 수면에서 터짐
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 60));
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
  }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);

  ctx.globalAlpha = .85;
  for (const f of flakes) {
    f.y += f.v; f.x += Math.sin(t + f.p) * .4 + wind;
    if (f.y > H + 5) { f.y = -5; f.x = rand(0, W); }
    if (f.x < -5) f.x = W + 5; else if (f.x > W + 5) f.x = -5;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

addEventListener('pointermove', e => { wind = (e.clientX / W - .5) * 1.6; });
cv.addEventListener('pointerdown', e => {
  const dx = e.clientX - whale.x, dy = e.clientY - whaleY();
  if (Math.hypot(dx, dy) < 100) {
    whale.vj = 10.5;                      // 지금 높이에서 다시 한 번 솟구침
    if (whale.jump === 0) whale.jump = 1;  // 수면에서 시작할 때만 띄움
    whale.say = lines[whale.n++ % lines.length]; whale.sayT = 170;
    spawn(whale.x + whale.dir * 60, whaleY() - 20, whale.jump > 40 ? 14 : 28, 0, .18, true);
  } else {
    spawn(e.clientX, e.clientY, 40, 4, .05, false);
    for (const f of flakes.slice(0, 25)) { f.x = e.clientX + rand(-120, 120); f.y = rand(-80, 0); }
  }
});
frame();
</script>
</body>
</html>
